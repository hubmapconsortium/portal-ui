name: 🌲🔬 Cypress Portal CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      api_env:
        description: "Backend APIs the portal under test points at"
        type: choice
        options: [test, prod]
        default: test

jobs:
  build:
    # Available versions:
    # https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm --version

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile --filter ./end-to-end...

      - name: Run test script
        run: etc/test/test-cypress.sh portal
        env:
          GH_ACTIONS_BRANCH: ${{ github.ref }}
          GH_ACTIONS: true
          API_ENV: ${{ inputs.api_env || 'test' }}

      - name: Show portal logs
        if: failure()
        run: docker logs hubmap-portal-ui 2>&1 | tail -300

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: end-to-end/cypress/screenshots
